name: Raccoon Coefficient Unified CI

on:
  push:
    branches:
      - main
      - feature/rc-wave9-unified-integration-20261104
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only Raccoon Coefficient
        uses: actions/checkout@v4
      - name: Set up Java 17 for Java 11 target
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enforce standalone plugin boundary
        shell: bash
        run: |
          if grep -RniE '(^import |implementation |compileOnly |runtimeOnly ).*(trashpandatracker|hoverlite|gg\.feral\.burrow)' src/main/java build.gradle; then
            echo "Raccoon Coefficient must not depend on other plugins"
            exit 1
          fi
      - name: Compile all production sources and run complete test suite
        run: bash ./gradlew --no-daemon --stacktrace clean build
      - name: Archive test evidence and plugin JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-unified-build-receipts
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/libs/**
          if-no-files-found: warn
