name: Wave 4 score truth build

on:
  push:
    branches:
      - feature/rc-wave4-score-truth-20261104
  pull_request:
    branches:
      - feature/rc-wave3-weapon-passives-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Raccoon Coefficient
        uses: actions/checkout@v4

      - name: Install JDK 17 (target Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enforce standalone plugin boundary
        shell: bash
        run: |
          if grep -RniE '(^import |implementation |compileOnly |runtimeOnly ).*(trashpandatracker|hoverlite|gg\.feral\.burrow)' src/main/java build.gradle; then
            echo "FORBIDDEN cross-plugin source/build dependency"
            exit 1
          fi

      - name: Compile and run all Java tests
        run: bash ./gradlew --no-daemon --stacktrace clean build

      - name: Save build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-wave4-build-receipts
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/libs/**
          if-no-files-found: warn
