name: RC Wave 8 Tooltip Coexistence

on:
  push:
    branches:
      - feature/rc-wave8-tooltip-coexistence-20261104
  pull_request:
    branches:
      - feature/rc-qa07-hoverlite-patterns-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Raccoon Coefficient
        uses: actions/checkout@v4
      - name: Java 17 (compiled for Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure no cross-plugin source dependencies
        shell: bash
        run: |
          if grep -RniE '(^import |implementation |compileOnly |runtimeOnly ).*(trashpandatracker|hoverlite|gg\.feral\.burrow)' src/main/java build.gradle; then
            echo 'Forbidden cross-plugin dependency'
            exit 1
          fi
      - name: Compile and execute entire JUnit suite
        run: bash ./gradlew --no-daemon --stacktrace clean build
      - name: Preserve reproducible build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-wave8-build-receipts
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/libs/**
          if-no-files-found: warn
