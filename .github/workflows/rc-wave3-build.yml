name: Wave 3 build (isolated)

on:
  push:
    branches:
      - feature/rc-wave3-weapon-passives-20261104
  pull_request:
    branches:
      - feature/rc-wave2-set-effects-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Raccoon Coefficient only
        uses: actions/checkout@v4

      - name: Set up JDK 17 (target Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard against other-plugin imports
        shell: bash
        run: |
          if grep -RniE '(^import |implementation |compileOnly |runtimeOnly ).*(trashpandatracker|hoverlite|gg\.feral\.burrow)' src/main/java build.gradle; then
            echo "Cross-plugin source/build dependency is forbidden."
            exit 1
          fi

      - name: Compile and unit test (no logged-in RuneLite)
        run: bash ./gradlew --no-daemon --stacktrace clean build

      - name: Upload build and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-wave3-build-receipts
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/libs/**
          if-no-files-found: warn
