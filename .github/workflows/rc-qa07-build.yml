name: RC-QA-007 HoverLite lessons source verification

on:
  push:
    branches:
      - feature/rc-qa07-hoverlite-patterns-20261104
  pull_request:
    branches:
      - feature/rc-qa06-source-hardening-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Raccoon Coefficient only
        uses: actions/checkout@v4
      - name: Java 17 (target Java 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Enforce independent plugin source
        shell: bash
        run: |
          if grep -RniE '(^import |implementation |compileOnly |runtimeOnly ).*(trashpandatracker|hoverlite|gg\.feral\.burrow)' src/main/java build.gradle; then
            echo 'Cross-plugin dependency forbidden'
            exit 1
          fi
      - name: Compile and run full regression suite
        run: bash ./gradlew --no-daemon --stacktrace clean build
      - name: Save test and JAR receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-qa07-build-receipts
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
            build/libs/**
          if-no-files-found: warn
